#
# Version updates. Security updates are enabled separately in repository
# settings. cargo and gradle are added once core/ and android/ exist.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age before adopting them, to avoid pulling a
    # compromised version in its first days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
